<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tejakrishna Badiganti | Full Stack Software Engineer</title>
    <meta name="description" content="" />
    <meta name="theme-color" content="#faf9f6" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./packages/css/styles.css" />
    <link rel="stylesheet" href="./packages/css/classic.css" />
    <link rel="modulepreload" href="./packages/js/main.js" />
    <link rel="modulepreload" href="./packages/js/site.js" />
    <link rel="modulepreload" href="./packages/js/render.js" />
    <link rel="modulepreload" href="./packages/js/defaults.js" />
    <link rel="modulepreload" href="./packages/js/theme.js" />
    <link rel="modulepreload" href="./packages/js/reveal.js" />
    <link rel="modulepreload" href="./packages/js/dom.js" />
    <link rel="modulepreload" href="./packages/js/store.js" />
    <link rel="modulepreload" href="./packages/js/ui.js" />
    <link rel="modulepreload" href="./packages/js/motion.js" />
    <script>
      // Start loading the content right away instead of waiting for the scripts to run.
      window.contentRequest = fetch("data/content.json?t=" + Date.now(), { cache: "no-store" });
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var saved = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!--==================== HEADER ====================-->
    <header class="site-header" id="header">
      <div class="container site-header__inner">
        <a href="#top" class="brand" id="brand">
          <span class="brand__mark" id="brand-mark"></span>
          <span class="brand__name" id="brand-name"></span>
        </a>

        <nav class="nav" id="nav" aria-label="Primary">
          <ul class="nav__list" id="nav-list"></ul>
        </nav>

        <div class="site-header__actions">
          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
          >
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
          <button
            class="icon-button nav-toggle"
            id="nav-toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="nav"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
    </header>

    <main id="main">
      <noscript><p class="container load-error">Please enable JavaScript to view this page.</p></noscript>

      <!--==================== HERO ====================-->
      <section class="hero" id="top">
        <div class="container hero__inner">
          <div class="hero__content">
            <p class="eyebrow" id="hero-eyebrow"></p>
            <h1 class="hero__title" id="hero-title"></h1>
            <p class="hero__lead" id="hero-lead"></p>
            <div class="hero__cta">
              <a class="button button--primary" id="hero-cta-primary" href="#contact" data-open-contact></a>
              <a class="button button--ghost" id="hero-resume" href="#" download>Download resume</a>
            </div>
            <ul class="hero__meta" id="hero-meta"></ul>
          </div>

          <figure class="hero__figure">
            <div class="hero__stage" id="hero-stage">
              <img id="hero-photo" alt="" width="960" height="1144" fetchpriority="high" decoding="async" />
            </div>
          </figure>
        </div>
      </section>

      <!--==================== STATS ====================-->
      <section class="stats" id="highlights" aria-label="Highlights">
        <div class="container stats__inner" id="stats"></div>
      </section>

      <!--==================== BADGE STRIP ====================-->
      <section class="badges" id="badges" aria-label="Certification badges" hidden>
        <div class="badges__viewport">
          <ul class="badges__track" id="badge-strip"></ul>
        </div>
      </section>

      <!--==================== ABOUT ====================-->
      <section class="section" id="about">
        <div class="container section__grid">
          <header class="section__head">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <div class="prose" id="about-body"></div>
        </div>
      </section>

      <!--==================== EXPERIENCE ====================-->
      <section class="section section--alt" id="experience">
        <div class="container">
          <header class="section__head section__head--center">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <ol class="timeline" id="timeline"></ol>
        </div>
      </section>

      <!--==================== SELECTED WORK ====================-->
      <section class="section" id="work">
        <div class="container">
          <header class="section__head section__head--center">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <div class="cards" id="work-cards"></div>
        </div>
      </section>

      <!--==================== SKILLS ====================-->
      <section class="section section--alt" id="skills">
        <div class="container">
          <header class="section__head section__head--center">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <div class="skills" id="skills-grid"></div>
        </div>
      </section>

      <!--==================== AWARDS ====================-->
      <section class="section" id="awards">
        <div class="container">
          <header class="section__head section__head--center">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <ul class="awards" id="awards-list"></ul>
        </div>
      </section>

      <!--==================== CERTIFICATIONS ====================-->
      <section class="section section--alt" id="certifications">
        <div class="container">
          <header class="section__head section__head--center">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <div id="cert-groups"></div>
          <p class="certs__footer">
            <span id="cert-note"></span>
            <a id="cert-credly" href="#" target="_blank" rel="noopener noreferrer"></a>.
          </p>
        </div>
      </section>

      <!--==================== EDUCATION ====================-->
      <section class="section" id="education">
        <div class="container section__grid">
          <header class="section__head">
            <p class="eyebrow" data-eyebrow></p>
            <h2 class="section__title" data-title></h2>
          </header>
          <ul class="education" id="education-list"></ul>
        </div>
      </section>

      <!--==================== CONTACT ====================-->
      <section class="section section--alt contact" id="contact">
        <div class="container contact__inner">
          <p class="eyebrow" data-eyebrow></p>
          <h2 class="contact__title" data-title></h2>
          <p class="contact__lead" id="contact-lead"></p>
          <div class="contact__actions">
            <button class="button button--primary button--large" id="contact-form-open" type="button" data-open-contact></button>
            <a class="button button--ghost button--large" id="contact-email" href="#"></a>
          </div>
          <ul class="contact__links" id="contact-links"></ul>
        </div>
      </section>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
        <div class="site-footer__links">
          <a href="#top">Back to top &uarr;</a>
          <button class="admin-link" id="admin-login" type="button" hidden>Admin login</button>
        </div>
      </div>
    </footer>

    <a class="to-top" id="to-top" href="#top" aria-label="Back to top">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </a>

    <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-dialog-title">
      <form class="contact-form" id="contact-form" method="post" action="#" novalidate>
        <header class="contact-form__head">
          <h3 class="contact-form__title" id="contact-dialog-title"></h3>
          <button class="icon-button" id="contact-close" type="button" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <p class="contact-form__intro" id="contact-intro"></p>

        <div class="contact-form__grid">
          <div class="cf-field">
            <label for="cf-first">First name <span aria-hidden="true">*</span></label>
            <input id="cf-first" name="firstName" type="text" autocomplete="given-name" maxlength="80" required />
          </div>
          <div class="cf-field">
            <label for="cf-last">Last name <span aria-hidden="true">*</span></label>
            <input id="cf-last" name="lastName" type="text" autocomplete="family-name" maxlength="80" required />
          </div>
          <div class="cf-field">
            <label for="cf-email">Email <span aria-hidden="true">*</span></label>
            <input id="cf-email" name="email" type="email" autocomplete="email" maxlength="120" required />
          </div>
          <div class="cf-field">
            <label for="cf-phone">Phone number <span aria-hidden="true">*</span></label>
            <input id="cf-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="+91 98765 43210" required />
          </div>
          <div class="cf-field cf-field--full">
            <label for="cf-reason">Reason for connecting <span aria-hidden="true">*</span></label>
            <select id="cf-reason" name="reason" required></select>
          </div>
          <div class="cf-field cf-field--full" id="cf-other-wrap" hidden>
            <label for="cf-other">Please tell me the reason <span aria-hidden="true">*</span></label>
            <input id="cf-other" name="otherReason" type="text" maxlength="120" />
          </div>
          <div class="cf-field cf-field--full">
            <label for="cf-message">Message (optional)</label>
            <textarea id="cf-message" name="message" rows="3" maxlength="1000"></textarea>
          </div>
          <div class="cf-hp" aria-hidden="true">
            <label for="cf-website">Leave this field empty</label>
            <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
        </div>

        <p class="contact-form__note">Fields marked * are required.</p>
        <p class="contact-form__status" id="contact-status" role="status" aria-live="polite"></p>
        <div class="contact-form__actions">
          <button class="button button--ghost" id="contact-cancel" type="button">Cancel</button>
          <button class="button button--primary" id="contact-submit" type="submit">Send message</button>
        </div>
      </form>

      <div class="contact-success" id="contact-success" hidden>
        <h3 class="contact-form__title">Message sent</h3>
        <p id="contact-thanks"></p>
        <button class="button button--primary" id="contact-done" type="button">Close</button>
      </div>
    </dialog>

    <dialog class="lightbox" id="cert-dialog" aria-labelledby="cert-dialog-title">
      <div class="lightbox__panel">
        <header class="lightbox__bar">
          <img class="lightbox__badge" id="cert-badge" alt="" hidden />
          <div class="lightbox__heading">
            <h3 class="lightbox__title" id="cert-dialog-title"></h3>
            <p class="lightbox__issuer" id="cert-issuer"></p>
          </div>
          <div class="lightbox__actions">
            <a class="button button--primary" id="cert-download" href="#" download>Download</a>
            <a
              class="button button--ghost"
              id="cert-verify"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              >Verify</a
            >
            <button class="button button--ghost" id="cert-close" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
              Close
            </button>
          </div>
        </header>
        <div class="lightbox__body">
          <img class="lightbox__image" id="cert-image" alt="" />
        </div>
      </div>
    </dialog>

    <script type="module" src="./packages/js/main.js"></script>
  </body>
</html>
